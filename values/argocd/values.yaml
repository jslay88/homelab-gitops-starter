# Slim self-manage values. LAN Ingress, named admin, GitHub webhook:
# docs/waves/7-argocd.md  — do not put passwords or webhook secrets here.
configs:
  params:
    application.resourceTrackingMethod: label

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
