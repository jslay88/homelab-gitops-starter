# Minimal stack. No Alertmanager receivers (add Slack/Pushover yourself).
# Grafana admin: do not set adminPassword here. Seal grafana-admin —
# docs/observability.md#grafana-admin
alertmanager:
  enabled: true

grafana:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: longhorn

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
