# CHANGEME: host, zone, domain-filter, tsig key name.
# Seal Secret "tsig" key "secret" in namespace external-dns.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          args:
            - --registry=txt
            - --txt-prefix=external-dns-
            - --txt-owner-id=k8s
            - --provider=rfc2136
            - --rfc2136-host=192.168.1.2
            - --rfc2136-port=53
            - --rfc2136-zone=k8s.home.example.com
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-keyname=externaldns-key
            - --rfc2136-tsig-axfr
            - --source=service
            - --source=ingress
            - --domain-filter=k8s.home.example.com
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: tsig
                  key: secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 128Mi
