apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/YOUR_GITHUB/homelab-gitops-starter.git
      targetRevision: main
      ref: values
    - repoURL: ghcr.io/nginx/charts
      chart: nginx-ingress
      targetRevision: 2.6.4
      helm:
        releaseName: nginx-ingress
        valueFiles:
          - $values/values/nginx-ingress/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.ports[]?.nodePort
        - .spec.healthCheckNodePort
