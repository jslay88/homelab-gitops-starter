# Optional. Delete this file if you are Let's Encrypt-only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step-issuer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: https://github.com/YOUR_GITHUB/homelab-gitops-starter.git
      targetRevision: main
      ref: values
    - repoURL: https://smallstep.github.io/helm-charts
      chart: step-issuer
      targetRevision: 1.11.0
      helm:
        releaseName: step-issuer
        valueFiles:
          - $values/values/step-issuer/values.yaml
    - repoURL: https://github.com/YOUR_GITHUB/homelab-gitops-starter.git
      targetRevision: main
      path: values/step-issuer/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: step-issuer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
