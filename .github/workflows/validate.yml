name: Validate YAML

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyYAML
        run: pip install pyyaml
      - name: kubeconform and kustomize
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
      - name: Validate
        run: ./scripts/validate-yaml.sh
